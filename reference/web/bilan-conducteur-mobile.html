<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trajet Chavelot – Épinal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Kind, écran de fin de trajet : une colonne de téléphone, verdict d'abord, détail ensuite. */
  --bg:#F6F6F4; --panel:#FFFFFF; --line:#E2E2DD; --text:#1C1F23; --muted:#646A72; --accent:#1F4E79;
  --douce:#3B82C4; --limite:#D4A017; --brusque:#E07B39; --tres:#C0392B; --bon:#3F8F6B; --off:#B8BEC6;
  --font:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.phone{max-width:430px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:17px;font-weight:600;margin:0}
.top span{color:var(--muted);font-size:13px;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#EBEBE7;border-radius:8px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;border-radius:6px;min-height:36px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{position:absolute;inset:0}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring b small{font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}
.stats{display:flex;flex-direction:column;gap:10px}
.verdict{font-size:20px;font-weight:600}
.stat{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.stat b{font-size:20px;font-weight:600}
.stat span{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--k);margin-right:6px;vertical-align:middle}
.crit{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .name{font-weight:500}
.row .sub{color:var(--muted);font-size:12px}
.row .note{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .note small{font-size:11px;color:var(--muted);font-weight:400}
.meter{grid-column:2/-1;height:4px;background:#EDEDEA;border-radius:2px;overflow:hidden;margin-top:-4px}
.meter i{display:block;height:100%;background:var(--k)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mapwrap{position:relative;padding:0;overflow:hidden}
#map{display:block;width:100%;height:auto;background:#EEF0F2;touch-action:manipulation}
.glass{position:absolute;top:10px;right:10px;width:74px;height:84px;background:rgba(255,255,255,.94);border-radius:8px;box-shadow:inset 0 0 0 3px var(--douce);display:flex;align-items:center;justify-content:center}
.mapbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.play{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.play svg{width:18px;height:18px;fill:currentColor}
#scrub{flex:1;accent-color:var(--accent);min-width:0}
#clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.live{display:flex;justify-content:space-between;padding:0 12px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.live b{color:var(--text);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-height:32px;padding:0 10px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.osm{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(255,255,255,.94);padding:4px 8px;border-radius:6px;color:var(--accent);text-decoration:none;display:none}
.zoomall{position:absolute;left:10px;top:10px;display:none}
h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 2px 0}
.lanes svg{display:block;width:100%;height:auto;cursor:crosshair}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 0}
.toggle{display:flex;gap:4px}
.toggle button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;min-height:30px;padding:0 10px;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.list{display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:4px 20px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:var(--panel);border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;color:var(--text)}
.m:first-child{border-top:0}
.m .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--k)}
.m .ico{width:18px;height:18px;color:var(--muted)}
.m .what{font-weight:500}
.m .where{font-size:12px;color:var(--muted)}
.m .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.m .val small{display:block;font-size:11px;color:var(--muted)}
.more{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:8px 0 0;cursor:pointer}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--text);font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"−"}
details p{margin:8px 0 0}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;text-align:center;font-size:11px}
.scale div{border-top:4px solid var(--k);padding-top:4px}
.scale b{display:block;color:var(--text);font-size:12px}
@media (prefers-reduced-motion:reduce){.glass{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><h1>Chavelot → Av. Dutac</h1><span id="when"></span></div>
  <div class="seg" role="group" aria-label="Type de véhicule">
    <button type="button" data-p="bus">Bus</button>
    <button type="button" data-p="car">Autocar</button>
    <button type="button" data-p="voiture">Voiture</button>
  </div>

  <section class="card hero" aria-label="Score du trajet">
    <div class="ring" id="ring"></div>
    <div class="stats">
      <div class="verdict" id="verdict"></div>
      <div class="stat"><b id="sDoux"></b><span>du temps en douceur</span></div>
      <div class="stat"><b id="sBrus"></b><span id="sBrusL">moments brusques</span></div>
    </div>
  </section>

  <section class="card crit" id="crit" aria-label="Notes par critère"></section>

  <section class="card mapwrap" aria-label="Carte et rejeu">
    <svg id="map" role="img" aria-label="Tracé du trajet coloré selon la douceur"></svg>
    <div class="glass" id="glassBox">
      <svg width="54" height="62" viewBox="0 0 220 220" aria-hidden="true">
        <defs><clipPath id="gc"><path d="M55 20 L165 20 L154 188 Q153 200 141 200 L79 200 Q67 200 66 188 Z"></path></clipPath></defs>
        <g clip-path="url(#gc)"><g id="liquid"><rect id="liq" x="-60" y="110" width="340" height="220" fill="#3B82C4"></rect><line x1="-60" y1="110" x2="280" y2="110" stroke="#fff" stroke-width="6"></line></g></g>
        <path d="M55 20 L165 20 L154 188 Q153 200 141 200 L79 200 Q67 200 66 188 Z" fill="none" stroke="#7C848D" stroke-width="10" stroke-linejoin="round"></path>
      </svg>
    </div>
    <button type="button" class="iconbtn zoomall" id="zoomAll">Tout le trajet</button>
    <a class="osm" id="osm" href="#">Voir sur une carte</a>
    <div class="mapbar">
      <button type="button" class="play" id="play" aria-label="Lancer le rejeu"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5l12 7-12 7z"/></svg></button>
      <input id="scrub" type="range" min="0" value="0" aria-label="Position dans le trajet">
      <span id="clock"></span>
    </div>
    <div class="live"><span><b id="lv"></b> km/h</span><span id="lstate"></span><span>avant <b id="llo"></b> · côté <b id="lla"></b></span></div>
  </section>

  <h2>Courbes</h2>
  <section class="card lanes" aria-label="Courbes du trajet"><svg id="chart" role="img" aria-label="Accélérations avant/arrière et latérales sur le trajet"></svg></section>

  <div class="mhead"><h2 style="margin:0">À revoir</h2>
    <div class="toggle" role="group" aria-label="Classer"><button type="button" data-o="int" aria-pressed="true">Intensité</button><button type="button" data-o="time" aria-pressed="false">Trajet</button></div>
  </div>
  <section class="card" aria-label="Moments à revoir"><div class="list" id="list"></div><button type="button" class="more" id="more"></button></section>

  <section class="card"><details><summary>Comment est calculé le score</summary>
    <p>Chaque freinage, accélération et virage est noté : 100 s’il est doux, 70 limite, 30 brusque, 0 très brusque. Le score est la moyenne.</p>
    <div class="scale" id="scale"></div>
    <p id="srcnote"></p>
  </details></section>
</div>

  c+=`<rect x="${x0}" y="${y(L3[1])}" width="${x1-x0}" height="${y(-L3[1])-y(L3[1])}" fill="#F3F3F0"/><line x1="${x0}" x2="${x1}" y1="${mid}" y2="${mid}" stroke="#DCDCD6"/>`;
  c+=`<text x="${x0+2}" y="${n*(LH+10)+14}" font-size="10" fill="#646A72">${lab}</text>`;
  let p='';for(let i=0;i<N;i++)p+=`${tx(S.t[i]).toFixed(1)},${y(serie[i]).toFixed(1)} `;
  c+=`<polyline points="${p}" fill="none" stroke="#9DB7CF" stroke-width="1.2"/>`;
  for(let i=1;i<N;i++){const l=lvA(serie[i]);if(l<1)continue;c+=`<line x1="${tx(S.t[i-1]).toFixed(1)}" y1="${y(serie[i-1]).toFixed(1)}" x2="${tx(S.t[i]).toFixed(1)}" y2="${y(serie[i]).toFixed(1)}" stroke="${COL[l]}" stroke-width="${l>1?3:2}" stroke-linecap="round"/>`;}
});
for(let m=0;m<=Math.floor((S.t[N-1]-S.t[0])/60);m+=2){const t=S.t[0]+m*60;c+=`<text x="${tx(t)}" y="${CH-2}" text-anchor="middle" font-size="10" fill="#646A72">${clockAt(t).slice(0,5)}</text>`;}
c+=`<line id="cursor" y1="0" y2="${CH-14}" stroke="#1F4E79" stroke-width="1.5"/>`;
ch.innerHTML=c;
const cursor=$('cursor');
ch.addEventListener('click',ev=>{const r=ch.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*CW;seek(idxOf(S.t[0]+(x-x0)/(x1-x0)*(S.t[N-1]-S.t[0])));});

// moments à revoir
const idxOf=t=>Math.max(0,Math.min(N-1,Math.round((t-S.t[0])*5)));
M.forEach(m=>m.int=Math.max(Math.abs(m.pic_ms2)/L3[1],m.jerk_max/TH.jerk[1]));
let order='int', showAll=false;
function renderList(){
  const L=(order==='int'?[...M].sort((a,b)=>b.int-a.int):[...M].sort((a,b)=>a.t-b.t));
  const shown=showAll?L:L.slice(0,6);
  $('list').innerHTML=shown.map((m,i)=>{const ic=m.critere==='virage'?(m.libelle.endsWith('gauche')?'vg':'vd'):m.critere;
    const what=m.critere==='virage'?(m.libelle.endsWith('gauche')?'Virage à gauche':'Virage à droite'):(m.critere==='freinage'?'Freinage':'Accélération');
    const where=m.d_arret<=150?`${m.rel==='à l’approche de'?'Avant':m.rel==='au départ de'?'Après':'À'} l’arrêt ${m.arret}`:`${Math.round(m.vitesse_kmh)} km/h`;
    return `<button type="button" class="m" style="--k:${LVC[m.niveau]}" data-t="${m.t}" data-la="${m.lat_gps}" data-lo="${m.lon_gps}"><span class="bar"></span>${ico(ic)}<span><span class="what">${what}</span><br><span class="where">${m.heure.slice(0,5)} · ${where}</span></span><span class="val">${fmt(Math.abs(m.pic_ms2))}<small>${LVN[m.niveau]}</small></span></button>`;}).join('');
  $('more').textContent=showAll?'Afficher moins':`Afficher les ${L.length} moments`;
  $('more').style.display=L.length>6?'block':'none';
  document.querySelectorAll('.m').forEach(b=>b.onclick=()=>{const la=+b.dataset.la,lo=+b.dataset.lo;focusC.setAttribute('cx',PX(lo));focusC.setAttribute('cy',PY(la));focusC.setAttribute('opacity',1);setView(PX(lo),PY(la),5);
    const o=$('osm');o.href=`https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=18/${la}/${lo}`;o.style.display='block';seek(idxOf(+b.dataset.t-3));play(true);map.scrollIntoView({behavior:'smooth',block:'center'});});
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{order=b.dataset.o;document.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList();});
$('more').onclick=()=>{showAll=!showAll;renderList();};
renderList();

// détail du calcul
$('scale').innerHTML=[['#3B82C4','Doux',`< ${fmt(L3[0])}`],['#D4A017','Limite',`${fmt(L3[0])}–${fmt(L3[1])}`],['#E07B39','Brusque',`${fmt(L3[1])}–${fmt(L3[2])}`],['#C0392B','Très brusque',`> ${fmt(L3[2])}`]].map(([k,n,v])=>`<div style="--k:${k}"><b>${n}</b>${v} m/s²</div>`).join('');
$('srcnote').textContent=PR==='bus'?'Seuils pour passagers debout, d’après Krašna et al., 2021 : rester sous 1,5 m/s² en pointe et 1,0 m/s² au freinage.':PR==='car'?'Seuils pour passagers assis et attachés.':'Seuils pour une voiture.';

// rejeu et verre d'eau
const liquid=$('liquid'), liq=$('liq'), gb=$('glassBox'), scrub=$('scrub');
scrub.max=N-1;
let i=0, playing=false, last=0, acc=0;
function render(){const lo=S.lo[i],la=S.la[i],e=E[i];
  const dom=Math.abs(lo)>=Math.abs(la)?-lo:la, ang=Math.atan(Math.hypot(lo,la)/9.81)*180/Math.PI*1.6*Math.sign(dom||1);
  liquid.setAttribute('transform',`rotate(${ang.toFixed(1)} 110 110)`);liq.setAttribute('fill',COL[e]);
  gb.style.boxShadow=`inset 0 0 0 ${[2,4,6,8][e]}px ${COL[e]}`;
  $('lv').textContent=Math.round(S.v[i]);$('llo').textContent=fmt(lo);$('lla').textContent=fmt(la);
  $('lstate').textContent=['Doux','Limite','Brusque','Très brusque'][e];$('lstate').style.color=e?COL[e]:'var(--muted)';
  scrub.value=i;$('clock').textContent=clockAt(S.t[i]);cursor.setAttribute('x1',tx(S.t[i]));cursor.setAttribute('x2',tx(S.t[i]));carAt(S.t[i]);}
function seek(n){i=Math.max(0,Math.min(N-1,n));render();}
function tick(ts){if(!playing)return;if(!last)last=ts;acc+=(ts-last)/1000*25;last=ts;const st=Math.floor(acc);if(st>0){acc-=st;i+=st;if(i>=N-1){i=N-1;play(false);}render();}requestAnimationFrame(tick);}
function play(on){playing=on;$('playIco').innerHTML=on?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 5l12 7-12 7z"/>';$('play').setAttribute('aria-label',on?'Mettre en pause':'Lancer le rejeu');if(on){last=0;acc=0;if(i>=N-1)i=0;requestAnimationFrame(tick);}}
$('play').onclick=()=>play(!playing);
scrub.oninput=()=>seek(+scrub.value);
seek(0);
</script>
</body>
</html>
